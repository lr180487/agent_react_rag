[project]
name = "agente-react-rag"
version = "1.0.1"
description = "API FastAPI con integración LangChain y proveedor OpenAI-compatible"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "langchain>=0.3,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.2,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.12,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
